.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

            &lt;option value=&quot;正史外&quot;&gt;正史外&lt;/option&gt;

      &lt;textarea class=&quot;form-control&quot; id=&quot;hm-trpg-want&quot; placeholder=&quot;例：森を探索したい／ギルドの初仕事／会話多め／全部おまかせ&quot;&gt;&lt;/textarea&gt;
      &lt;fieldset class=&quot;hm-section&quot;&gt;
        &lt;legend&gt;記入候補&lt;/legend&gt;
        &lt;div class=&quot;hm-choice-grid&quot;&gt;
          &lt;div class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; id=&quot;hm-trpg-short&quot; value=&quot;1〜2時間程度の短い依頼&quot; data-group=&quot;trpg-tone&quot; checked&gt;&lt;label class=&quot;form-check-label&quot; for=&quot;hm-trpg-short&quot;&gt;短い依頼&lt;/label&gt;&lt;/div&gt;
          &lt;div class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; id=&quot;hm-trpg-explore&quot; value=&quot;探索を楽しみたい&quot; data-group=&quot;trpg-tone&quot;&gt;&lt;label class=&quot;form-check-label&quot; for=&quot;hm-trpg-explore&quot;&gt;探索多め&lt;/label&gt;&lt;/div&gt;
          &lt;div class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; id=&quot;hm-trpg-talk&quot; value=&quot;会話やNPC交流を楽しみたい&quot; data-group=&quot;trpg-tone&quot;&gt;&lt;label class=&quot;form-check-label&quot; for=&quot;hm-trpg-talk&quot;&gt;会話多め&lt;/label&gt;&lt;/div&gt;

          &lt;div class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; id=&quot;hm-trpg-life&quot; value=&quot;食料・装備・依頼準備など冒険者の生活感も楽しみたい&quot; data-group=&quot;trpg-tone&quot;&gt;&lt;label class=&quot;form-check-label&quot; for=&quot;hm-trpg-life&quot;&gt;冒険者の生活感&lt;/label&gt;&lt;/div&gt;
          &lt;div class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; id=&quot;hm-trpg-ai-party&quot; value=&quot;不足する仲間はAI代理PCで補いたい&quot; data-group=&quot;trpg-tone&quot;&gt;&lt;label class=&quot;form-check-label&quot; for=&quot;hm-trpg-ai-party&quot;&gt;仲間はAI代理可&lt;/label&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/fieldset&gt;
    &lt;/section&gt;

    &lt;details class=&quot;hm-section&quot;&gt;
      &lt;summary&gt;任意：苦手・避けたいこと、描写の希望&lt;/summary&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;hm-boundaries&quot;&gt;希望や避けたいこと&lt;/label&gt;
      &lt;textarea class=&quot;form-control&quot; id=&quot;hm-boundaries&quot; placeholder=&quot;例：残酷描写は軽め／恋愛なし／テンポ重視／じっくり会話したい&quot;&gt;&lt;/textarea&gt;
    &lt;/details&gt;

    &lt;section class=&quot;hm-section&quot;&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;hm-preview&quot;&gt;送信される開始メッセージ&lt;/label&gt;
      &lt;textarea class=&quot;form-control&quot; id=&quot;hm-preview&quot; readonly&gt;&lt;/textarea&gt;
      &lt;p id=&quot;hm-error&quot; class=&quot;text-small text-destructive hm-mode-note&quot; aria-live=&quot;assertive&quot;&gt;&lt;/p&gt;
      &lt;p id=&quot;hm-status&quot; class=&quot;text-small text-muted hm-mode-note&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
      &lt;div class=&quot;viz-controls&quot;&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;hm-start&quot;&gt;この内容で相談を始める&lt;/button&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;hm-copy&quot;&gt;文章をコピー&lt;/button&gt;
      &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;hoshimichi-start-form&#x27;);
      const modeNotes = {
        consult: &#x27;テーマだけで開始できます。迷う部分は候補を出しながら一緒に整理します。&#x27;,
        rp: &#x27;ダイス判定を使わない通常RPです。人物と場面があれば始められます。&#x27;,
        viewpoint: &#x27;特定人物の視点から場面を遊び、人物像や設定を自然に発掘します。&#x27;,
        trpg: &#x27;PC名と主な攻撃手段が最小入力です。本編前にシナリオ準備と起動確認を行います。&#x27;
      };

      const value = (id) =&gt; root.querySelector(`#${id}`).value.trim();
      const selectedMode = () =&gt; root.querySelector(&#x27;input[name=&quot;hm-mode&quot;]:checked&#x27;).value;
      const checkedValues = (group) =&gt; Array.from(root.querySelectorAll(`[data-group=&quot;${group}&quot;]:checked`)).map((input) =&gt; input.value);
      const shown = (text) =&gt; text || &#x27;おまかせ&#x27;;

      const buildPrompt = () =&gt; {
        const mode = selectedMode();
        const boundaries = value(&#x27;hm-boundaries&#x27;);
        const lines = [];

        if (mode === &#x27;consult&#x27;) {
          lines.push(&#x27;/相談&#x27;);
          lines.push(&#x27;RP・TRPGを始めるため、次の内容を一緒に整理してください。&#x27;);
          lines.push(`相談テーマ：${shown(value(&#x27;hm-consult-topic&#x27;))}`);
          lines.push(`希望する進め方：${shown(checkedValues(&#x27;consult-help&#x27;).join(&#x27;、&#x27;))}`);
          lines.push(&#x27;正本に関係する内容は、AI参照索引から関連正本を特定し、原文を確認してから提案してください。&#x27;);
          lines.push(&#x27;未決定部分は勝手に確定せず、迷う項目は具体的な候補を最大三つ示してください。&#x27;);
        }

        if (mode === &#x27;rp&#x27;) {
          lines.push(&#x27;/相談&#x27;);
          lines.push(&#x27;次の内容で通常RPを始めたいです。開始に必要な確認と準備をしてください。&#x27;);
          lines.push(`自分が動かす人物：${shown(value(&#x27;hm-rp-character&#x27;))}`);
          lines.push(`一緒に出したい人物：${shown(value(&#x27;hm-rp-with&#x27;))}`);
          lines.push(`やりたい場面・気分：${shown(value(&#x27;hm-rp-scene&#x27;))}`);
          lines.push(`雰囲気：${shown(checkedValues(&#x27;rp-tone&#x27;).join(&#x27;、&#x27;))}`);
          lines.push(`扱い：${value(&#x27;hm-rp-status&#x27;)}`);
          lines.push(`進め方：${value(&#x27;hm-rp-start&#x27;)}`);
          lines.push(&#x27;通常RPとして、ダイス判定・死亡判定は使わず、ユーザー操作人物の重大な感情や決断を勝手に確定しないでください。&#x27;);
        }

        if (mode === &#x27;viewpoint&#x27;) {
          lines.push(&#x27;/相談&#x27;);
          lines.push(&#x27;次の内容で視点RPを始めたいです。開始に必要な確認と準備をしてください。&#x27;);
          lines.push(`視点人物：${shown(value(&#x27;hm-vp-character&#x27;))}`);
          lines.push(`場面にいる人物：${shown(value(&#x27;hm-vp-with&#x27;))}`);
          lines.push(`見たい場面・発掘したいこと：${shown(value(&#x27;hm-vp-scene&#x27;))}`);
          lines.push(`時期・場所：${shown(value(&#x27;hm-vp-time&#x27;))}`);
          lines.push(`扱い：${value(&#x27;hm-vp-status&#x27;)}`);
          lines.push(&#x27;描写返し型で進め、視点人物の感情や行動を勝手に強く確定せず、選択肢を毎回出さないでください。&#x27;);
          lines.push(&#x27;正本確認後、不足がなければ短い導入から始めてください。&#x27;);
        }

        if (mode === &#x27;trpg&#x27;) {
          lines.push(&#x27;/相談&#x27;);
          lines.push(&#x27;次の内容で星みちTRPGを始めたいです。まだ本編は開始せず、必要な正本確認とシナリオ準備をしてください。&#x27;);
          lines.push(`PC名：${shown(value(&#x27;hm-trpg-pc&#x27;))}`);
          lines.push(`主な攻撃手段：${shown(value(&#x27;hm-trpg-attack&#x27;))}`);
          lines.push(`シナリオ：${value(&#x27;hm-trpg-scenario&#x27;)}`);
          lines.push(`PC操作：${value(&#x27;hm-trpg-control&#x27;)}`);
          lines.push(`卓の扱い：${value(&#x27;hm-trpg-status&#x27;)}`);
          lines.push(`遊ぶ環境：${value(&#x27;hm-trpg-device&#x27;)}`);
          lines.push(`やりたい依頼・雰囲気：${shown(value(&#x27;hm-trpg-want&#x27;))}`);
          lines.push(`希望：${shown(checkedValues(&#x27;trpg-tone&#x27;).join(&#x27;、&#x27;))}`);
          lines.push(&#x27;不足情報は一度に大量質問せず、開始に必要なものから候補つきで確認してください。&#x27;);
          lines.push(&#x27;準備と起動試験がREADYになっても、私が「/シナリオ開始」と入力するまで本編を始めないでください。&#x27;);
        }

        if (boundaries) {
          lines.push(`希望・避けたいこと：${boundaries}`);
        }

        lines.push(&#x27;正本と入力が食い違う場合は勝手に統合せず、短く確認してください。&#x27;);
        return lines.join(&#x27;\n&#x27;);
      };

      const validate = () =&gt; {
        const mode = selectedMode();
        const required = {
          consult: [[&#x27;hm-consult-topic&#x27;, &#x27;相談したいこと&#x27;]],
          rp: [[&#x27;hm-rp-character&#x27;, &#x27;自分が動かす人物&#x27;], [&#x27;hm-rp-scene&#x27;, &#x27;やりたい場面・気分&#x27;]],
          viewpoint: [[&#x27;hm-vp-character&#x27;, &#x27;視点人物&#x27;], [&#x27;hm-vp-scene&#x27;, &#x27;見たい場面・発掘したいこと&#x27;]],
          trpg: [[&#x27;hm-trpg-pc&#x27;, &#x27;PC名&#x27;], [&#x27;hm-trpg-attack&#x27;, &#x27;主な攻撃手段&#x27;]]
        };
        const missing = required[mode].filter(([id]) =&gt; !value(id)).map(([, label]) =&gt; label);
        const error = root.querySelector(&#x27;#hm-error&#x27;);
        error.textContent = missing.length ? `★の必須欄を入力してください：${missing.join(&#x27;、&#x27;)}` : &#x27;&#x27;;
        return missing.length === 0;
      };

      const update = () =&gt; {
        const mode = selectedMode();
        root.querySelectorAll(&#x27;[data-panel]&#x27;).forEach((panel) =&gt; {
          panel.hidden = panel.dataset.panel !== mode;
        });
        root.querySelector(&#x27;#hm-mode-note&#x27;).textContent = modeNotes[mode];
        root.querySelector(&#x27;#hm-preview&#x27;).value = buildPrompt();
        root.querySelector(&#x27;#hm-error&#x27;).textContent = &#x27;&#x27;;
        root.querySelector(&#x27;#hm-status&#x27;).textContent = &#x27;&#x27;;
      };

      root.addEventListener(&#x27;input&#x27;, update);
      root.addEventListener(&#x27;change&#x27;, update);

      root.querySelector(&#x27;#hm-trpg-new-pc&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelector(&#x27;#hm-trpg-pc&#x27;).value = &#x27;まだいない（PC作成相談から）&#x27;;
        update();
      });

      root.querySelector(&#x27;#hm-trpg-undecided-attack&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelector(&#x27;#hm-trpg-attack&#x27;).value = &#x27;未定（PCに合う候補がほしい）&#x27;;
        update();
      });

      root.querySelector(&#x27;#hm-copy&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
        const status = root.querySelector(&#x27;#hm-status&#x27;);
        try {
          await navigator.clipboard.writeText(buildPrompt());
          status.textContent = &#x27;開始メッセージをコピーしました。&#x27;;
        } catch (error) {
          root.querySelector(&#x27;#hm-preview&#x27;).select();
          status.textContent = &#x27;自動コピーできませんでした。選択された文章をコピーしてください。&#x27;;
        }
      });

      root.querySelector(&#x27;#hm-start&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
        if (!validate()) return;
        const status = root.querySelector(&#x27;#hm-status&#x27;);
        status.textContent = &#x27;開始メッセージを送信しています…&#x27;;
        try {
          await window.openai.sendFollowUpMessage({
            prompt: buildPrompt(),
            title: &#x27;この内容でRP・TRPGの相談を始めますか？&#x27;
          });
          status.textContent = &#x27;開始メッセージを送信しました。&#x27;;
        } catch (error) {
          status.textContent = &#x27;送信できませんでした。「文章をコピー」を使って送ってください。&#x27;;
        }
      });

      update();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
